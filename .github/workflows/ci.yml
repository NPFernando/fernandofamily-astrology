name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools (pyswisseph compiles a C extension)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Verify vendored PyJHora engine
        working-directory: apps/api
        run: python3 scripts/verify_vendor.py --mode full

      - name: Ruff
        working-directory: apps/api
        run: ruff check app scripts tests

      - name: Pytest
        working-directory: apps/api
        run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm build

      - name: Enforce initial JavaScript budget
        working-directory: apps/web
        run: pnpm report:initial-bundle

      - name: Standalone runtime smoke test
        working-directory: apps/web
        run: pnpm test:standalone

      - name: Test (i18n hygiene, no-birth-fields-in-URL)
        working-directory: apps/web
        run: pnpm test

      - name: Report poster format payloads
        working-directory: apps/web
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            pnpm report:poster-payloads -- --base "$PR_BASE_SHA"
          else
            pnpm report:poster-payloads
          fi

  contracts-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: Install API dependencies into a venv (generate.mjs expects apps/api/.venv)
        working-directory: apps/api
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install web dependencies (provides openapi-typescript)
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Regenerate contracts and fail on drift
        run: |
          node packages/contracts/generate.mjs
          git diff --exit-code packages/contracts/openapi.json packages/contracts/api-types.d.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      - name: Install API dependencies into a venv (playwright webServer launches it)
        working-directory: apps/api
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (builds web, launches API + web via playwright webServer)
        working-directory: apps/web
        run: pnpm e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Lighthouse
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build production web app
        working-directory: apps/web
        run: pnpm build

      - name: Enforce mobile Lighthouse budgets
        working-directory: apps/web
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm lighthouse:ci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
